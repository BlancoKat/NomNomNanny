name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Publish a real release only when code lands on the default branch.
# Do not tag that release with the branch name. A tag named "main" collides
# with the branch, so GitHub leaves an untagged draft whose download URLs 404.
jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xvfb

      - name: install frontend dependencies
        run: npm install

      - name: build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - name: repair and verify Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          ./scripts/repair-linux-appimage.sh --in-place "$appimage"
          sudo apt-get install -y xvfb libegl1
          ./scripts/verify-linux-appimage.sh --launch "$appimage"

      - name: verify Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$deb"
          ./scripts/verify-linux-deb.sh --launch "$deb"

      - name: publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'NomNom Nanny v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Desktop installers for this version. Download the asset that matches your system.

            Linux (Debian, Ubuntu, and derivatives): download the `.deb` and install it with apt so WebKitGTK is pulled in:

            ```
            sudo apt update
            sudo apt install ./nomnom-nanny_*_amd64.deb
            ```

            Do not install that package with `dpkg -i` alone. On Arch and other distributions without a `.deb` or `.rpm`, use the AppImage (`chmod +x`). It must not bundle `libwayland-client`: host Mesa 26 aborts WebKit if the Ubuntu copy is loaded first. If FUSE cannot mount it, run `./nomnom-nanny_*_amd64.AppImage --appimage-extract-and-run`. A blank window with the process still running is a dead web renderer; the EGL abort is written to `~/.local/state/nomnom-nanny/appimage.log` when stderr is not a terminal.

            From a git checkout you can also run `./scripts/install-linux.sh`.

            Windows: run the `-setup.exe`. macOS: open the `.dmg` (Apple Silicon). If Gatekeeper blocks the app, right-click it and choose Open.
